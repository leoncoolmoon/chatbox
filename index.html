<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Chatbot PWA</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="shortcut icon" href="favicon.png" type="image/x-icon">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5575230312973422"
     crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>

<body>
  <div id="app-container">
    <div id="sidebar">
      <div id="sidebar-header">
        <h3 id="topicsTitle">Topics</h3>
        <div class="sidebar-controls">
          <button id="new-topic-button"><i class="ri-add-line"></i></button>
          <button id="close-sidebar" class="mobile-only"><i class="ri-close-line"></i></button>
        </div>
      </div>
      <div id="topic-list"></div>
      <div class="sidebar-actions">
        <button id="clear-conversation-button">Clear</button>
        <button id="download-conversation-button">Download</button>
        <button id="export-history-button">Export History</button>
        <button id="import-history-button">Import History</button>
        <input type="file" id="history-import-file" style="display:none;"/>
      </div>
    </div>

    <div id="main-content">
      <button id="menu-toggle" class="mobile-only"><i class="ri-menu-line"></i></button>
      <button id="mobile-settings-button" class="mobile-only" ><i class="ri-settings-3-line"></i></button>
      <div class="header-row">
        <button id="menu-toggle"><i class="ri-menu-line"></i></button>
        <h2 id="titleHead">Chatbot PWA</h2>
        <button id="mobile-settings-button" ><i class="ri-settings-3-line"></i></button>
      </div>

      <div class="input-area">
        <div class="input-main-row">
          <button id="start-recognition-button" title="Start Talk"><i class="ri-mic-line"></i></button>
          <textarea id="prompt-input" placeholder="Enter prompt for ChatGPT"></textarea>
          <button id="enter-prompt-button" title="Enter"><i class="ri-send-plane-2-line"></i></button>
        </div>

        <div class="input-sub-row">
          <label class="checkbox-container">
            <input type="checkbox" id="voice"/>
            <span class="switch-slider"></span>
            <span id="voiceLabel" title="Answer by voice"><i class="ri-volume-up-line"></i></span>
          </label>
          <div class="file-row">
            <label for="file-upload" id="file-upload-label" class="icon-button" title="Upload Files"><i class="ri-file-upload-line"></i></label>
            <input type="file" id="file-upload" multiple style="display:none;"/>
            <div id="file-list"></div>
          </div>
        </div>
      </div>

      <div id="chat-container">
        <div id="toolbar"></div>
        <div id="conversation-display"></div>
      </div>

    </div>

    <div id="right-panel">
      <div id="tree-section">
        <div class="section-header">
          <div class="tree-header-left">
            <h4 id="treeTitle">Conversation Tree</h4>
            <div class="tree-controls">
              <button id="batch-copy-button"><i class="ri-file-copy-line"></i></button>
              <button id="select-all-button" style="display:none;"><i class="ri-checkbox-multiple-line"></i></button>
            </div>
          </div>
          <button id="close-tree" class="mobile-only"><i class="ri-close-line"></i></button>
        </div>
        <div id="tree-container"></div>
      </div>

      <div id="settings-section">
        <div class="section-header">
          <h4 id="settingDiv">Settings</h4>
          <button id="close-settings" class="mobile-only"><i class="ri-close-line"></i></button>
        </div>

        <div id="modelSetting" class="setting-group">
          <label for="provider-select" id="providerSelectLabel">Provider</label>
          <select id="provider-select">
            <optgroup label="在线服务">
              <option value="openai">OpenAI</option>
              <option value="nvidia">NVIDIA NIM</option>
              <option value="groq">Groq</option>
              <option value="mistral">Mistral</option>
              <option value="anthropic">Anthropic</option>
              <option value="google">Google Gemini</option>
            </optgroup>
            <optgroup label="本地服务">
              <option value="lmstudio">LM Studio</option>
              <option value="ollama">Ollama</option>
              <option value="litellm">LiteLLM</option>
            </optgroup>
            <optgroup label="自定义">
              <option value="custom">自定义端点</option>
            </optgroup>
          </select>
          <div id="provider-hint" style="font-size:11px;color:#888;margin-top:2px;min-height:16px;"></div>

          <label for="base-url-input" id="baseUrlLabel">Base URL</label>
          <input id="base-url-input" type="text" placeholder="https://api.openai.com/v1"/>

          <label for="api-key-input" id="apiKeyInputLabel">API Key</label>
          <div class="input-with-toggle">
            <input id="api-key-input" type="password"/>
            <button type="button" id="showKeyBtn"><i class="ri-eye-line"></i></button>
          </div>

          <label for="model-input" id="modelSelectLabel">Model</label>
          <div class="model-select-container">
            <select id="model-input"></select>
            <button id="fetch-models-button"><i class="ri-refresh-line"></i></button>
          </div>

          <div class="range-group">
            <label for="temperature" id="temperatureLabel">Temperature: <span id="temperatureValue">0.7</span></label>
            <input type="range" min="0" max="1" value="0.7" step="0.1" id="temperature" />
          </div>

          <div class="range-group">
            <label for="context-window" id="contextWindowLabel">Context Window: <span id="contextWindowValue">10</span></label>
            <input type="range" min="1" max="50" value="10" step="1" id="context-window" />
          </div>

          <div class="checkbox-group">
            <label class="checkbox-container">
              <input type="checkbox" id="show-metadata-toggle" checked/>
              <span class="switch-slider"></span>
              <span id="showMetadataLabel">Show Metadata (Model, Tokens)</span>
            </label>
          </div>
        </div>

        <div id="promptSetting" class="setting-group">
          <label id="promptLibraryLabel">Prompt Library</label>

          <label id="promptNameLabel">Prompt Name</label>
          <input id="prompt-name-input" type="text" />

          <label for="system-prompt-input" id="systemPromptLabel">System Prompt</label>
          <textarea id="system-prompt-input" rows="3" style="width:100%;resize:vertical;padding:8px;border-radius:6px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text-color);font-family:inherit;font-size:13px;">You are a helpful assistant. You can help me by answering my questions. You can also ask me questions.</textarea>

          <div id="prompt-list" style="display: none; margin: 10px 0; border: 1px solid var(--input-border); border-radius: 6px; padding: 5px;"></div>

          <div class="portability-buttons" style="margin-top: 10px;">
            <button id="select-prompt-button">Select Prompt</button>
            <button id="save-prompt-button">Save Prompt</button>
            <button id="delete-prompt-button">Delete Prompt</button>
          </div>
        </div>

        <div id="ttsSetting" class="setting-group">
          <label for="theme-select" id="themeSelectLabel">Theme</label>
          <select id="theme-select">
            <option value="light">Light</option>
            <option value="dark">Dark</option>
            <option value="system" selected>System</option>
          </select>

          <label for="language-select" id="languageSelectLabel">UI Language</label>
          <select id="language-select">
            <option value="zh-CN">中文</option>
            <option value="en-GB" selected>English</option>
          </select>

          <label id="speechSettingLabel">Speech Settings</label>
          <div class="range-group">
            <label for="rate" id="rateLabel">Rate: <span class="rate-value">1.0</span></label>
            <input type="range" min="0.5" max="2" value="1.0" step="0.1" id="rate" />
          </div>
          <div class="range-group">
            <label for="pitch" id="pitchLabel">Pitch: <span class="pitch-value">1.0</span></label>
            <input type="range" min="0" max="2" value="1.0" step="0.1" id="pitch" />
          </div>
        </div>

        <div class="portability-buttons">
          <button id="export-settings-button">Export Settings</button>
          <button id="import-settings-button">Import Settings</button>
          <input type="file" id="settings-import-file" style="display:none;"/>
        </div>
      </div>
    </div>
  </div>

  <script src="storage.js"></script>
  <script src="migration.js"></script>
  <script src="script.js"></script>
  <script src="search.js"></script>
</body>

</html>
