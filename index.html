<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Chatbot PWA</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <style>
    /* 桌面端隐藏仅移动端使用的按钮 */
    @media (min-width: 769px) {
      .mobile-only { display: none !important; }
    }
  </style>
  <link rel="shortcut icon" href="favicon.png" type="image/x-icon">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5575230312973422"
     crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>

<body>
  <div id="app-container">
    <div id="sidebar">
      <div id="sidebar-header">
        <h3 id="topicsTitle">Topics</h3>
        <div class="sidebar-controls">
          <button id="new-topic-button">+</button>
          <button id="close-sidebar" class="mobile-only">×</button>
        </div>
      </div>
      <div id="topic-list"></div>
    </div>

    <div id="main-content">
      <div class="header-row">
        <button id="menu-toggle" class="mobile-only">☰</button>
        <h2 id="titleHead">Chatbot PWA</h2>
        <button id="mobile-settings-button" class="mobile-only">⚙️</button>
      </div>

      <div class="input-area">
        <div class="control-row">
          <button id="start-recognition-button">Start Talk</button>
          <label class="checkbox-container">
            <input type="checkbox" id="voice"/>
            <span id="voiceLabel">Answer by voice</span>
          </label>
        </div>

        <div class="prompt-container">
          <textarea id="prompt-input" placeholder="Enter promot for ChatGPT"></textarea>
          <button id="enter-promot-button">Enter</button>
        </div>

        <div class="file-row">
          <input type="file" id="file-upload" multiple/>
          <div id="file-list"></div>
        </div>
      </div>

      <div id="chat-container">
        <div id="toolbar"></div>
        <div id="conversation-display"></div>
      </div>

      <div class="action-buttons">
        <button id="clear-conversation-button">Clear</button>
        <button id="save-conversation-button">Save</button>
        <button id="export-history-button">Export History</button>
        <button id="import-history-button">Import History</button>
        <input type="file" id="history-import-file" style="display:none;"/>
      </div>
    </div>

    <div id="right-panel">
      <div id="tree-section">
        <h4 id="treeTitle">Conversation Tree</h4>
        <div id="tree-container"></div>
      </div>

      <div id="settings-section">
        <div class="section-header">
          <h4 id="settingDiv">Settings</h4>
          <button id="close-settings" class="mobile-only">×</button>
        </div>

        <div id="modelSetting" class="setting-group">
          <label for="provider-select" id="providerSelectLabel">Provider</label>
          <select id="provider-select">
            <option value="openai">OpenAI</option>
            <option value="nvidia">NVIDIA NIM</option>
            <option value="anthropic">Anthropic</option>
            <option value="google">Google Gemini</option>
            <option value="groq">Groq</option>
            <option value="mistral">Mistral</option>
            <option value="lmstudio">LM Studio</option>
            <option value="ollama">Ollama</option>
            <option value="litellm">LiteLLM</option>
            <option value="custom">Custom</option>
          </select>

          <label for="base-url-input" id="baseUrlLabel">Base URL</label>
          <input id="base-url-input" type="text" placeholder="https://api.openai.com/v1"/>

          <label for="api-key-input" id="apiKeyInputLabel">API Key</label>
          <div class="input-with-toggle">
            <input id="api-key-input" type="password"/>
            <button type="button" id="showKeyBtn">👁️</button>
          </div>

          <label for="model-input" id="modelSelectLabel">Model</label>
          <div class="model-select-container">
            <input id="model-input" type="text" list="model-options" placeholder="Select or type model"/>
            <datalist id="model-options">
              <option value="gpt-4-turbo">
              <option value="gpt-3.5-turbo">
            </datalist>
            <button id="fetch-models-button">🔄</button>
          </div>

          <div class="range-group">
            <label for="temperature" id="temperatureLabel">Temperature: <span id="temperatureValue">0.7</span></label>
            <input type="range" min="0" max="1" value="0.7" step="0.1" id="temperature" />
          </div>

          <div class="range-group">
            <label for="context-window" id="contextWindowLabel">Context Window: <span id="contextWindowValue">10</span></label>
            <input type="range" min="1" max="50" value="10" step="1" id="context-window" />
          </div>
        </div>

        <div id="promptSetting" class="setting-group">
          <label id="promptLibraryLabel">Prompt Library</label>
          <div id="prompt-list"></div>
          <button id="add-prompt-button">Add Prompt</button>
        </div>

        <div id="ttsSetting" class="setting-group">
          <label for="theme-select" id="themeSelectLabel">Theme</label>
          <select id="theme-select">
            <option value="light">Light</option>
            <option value="dark">Dark</option>
            <option value="system" selected>System</option>
          </select>

          <label for="language-select" id="languageSelectLabel">UI Language</label>
          <select id="language-select">
            <option value="zh-CN">中文</option>
            <option value="en-GB" selected>English</option>
          </select>

          <label id="speechSettingLabel">Speech Settings</label>
          <div class="range-group">
            <label for="rate" id="rateLabel">Rate: <span class="rate-value">1.0</span></label>
            <input type="range" min="0.5" max="2" value="1.0" step="0.1" id="rate" />
          </div>
          <div class="range-group">
            <label for="pitch" id="pitchLabel">Pitch: <span class="pitch-value">1.0</span></label>
            <input type="range" min="0" max="2" value="1.0" step="0.1" id="pitch" />
          </div>
        </div>

        <div class="portability-buttons">
          <button id="export-settings-button">Export Settings</button>
          <button id="import-settings-button">Import Settings</button>
          <input type="file" id="settings-import-file" style="display:none;"/>
        </div>
      </div>
    </div>
  </div>

  <script src="storage.js"></script>
  <script src="migration.js"></script>
  <script src="script.js"></script>
  <script src="search.js"></script>
</body>

</html>
